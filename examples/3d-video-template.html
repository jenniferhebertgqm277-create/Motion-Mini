<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion-Mini · 3D Video Template — Dadah Warga Kota 3D</title>
<!--
  MOTION-MINI 3D VIDEO TEMPLATE
  ------------------------------------------------------------------
  For AI agents: to make a NEW video, edit ONLY the CONFIG block and
  (if needed) the PROPS section. Do NOT rewrite the ENGINE section.
  That saves ~80% of output tokens per video.

  Rules baked in:
   - Everything is a pure function of time:  renderAt(t)  (no Math.random in loop)
   - One hero action per beat, max 2 supporting actions
   - 3-point lighting + shadows + fog + ACES tone mapping
   - Export-ready:  index.html?capture=1  ->  window.captureAt(t) returns PNG dataURL
-->
<style>
  :root{color-scheme:dark}
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#05060d;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;overflow:hidden}
  #stage{position:absolute;inset:0;display:grid;place-items:center}
  #frame{position:relative;aspect-ratio:16/9;width:min(100vw,calc(100vh*16/9));background:#000;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .bar{position:absolute;left:0;right:0;height:7%;background:#000;z-index:2}
  .bar.top{top:0}.bar.bot{bottom:0}
  #caption{position:absolute;left:0;right:0;bottom:12%;text-align:center;z-index:3;
    font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    font-size:clamp(14px,3.4vw,44px);text-shadow:0 2px 24px rgba(0,0,0,.6);opacity:0;will-change:opacity,transform}
  #ui{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;padding:8px 12px;
    background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:12px}
  #ui button{background:#ffffff22;border:0;color:#fff;border-radius:8px;padding:6px 12px;font-size:14px}
  #ui input{flex:1}
  body.capture #ui{display:none}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <div class="bar top"></div><div class="bar bot"></div>
  <div id="caption"></div>
  <div id="ui"><button id="play">⏸</button><input id="seek" type="range" min="0" step="0.01" value="0"><span id="clock"></span></div>
</div></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ════════════════════════════════════════════════════════════════
   CONFIG  — the only part an AI needs to edit for a new video
   ════════════════════════════════════════════════════════════════ */
const CONFIG = {
  duration: 13,                 // seconds
  fps: 30,                      // export fps
  size: [1280, 720],            // export size
  seed: 7,                      // seeded RNG → identical city every render

  // Storyboard (documentation + HUD label). ONE hero per beat.
  scenes: [
    { from: 0,   to: 3,   name: 'S1 Establishing', hero: 'kota senja',          shot: 'high wide → dolly in' },
    { from: 3,   to: 9.5, name: 'S2 Hero',         hero: 'karakter melambai',   shot: 'orbit kanan → kiri' },
    { from: 9.5, to: 13,  name: 'S3 Farewell',     hero: 'kota malam + burung', shot: 'crane up & back' },
  ],

  // Camera keyframes — Catmull-Rom spline (no hard stop at keys = cinematic)
  camera: [
    { t: 0,    pos: [0, 5, 46],   look: [0, 7, 0]   },
    { t: 3,    pos: [0, 3.2, 22], look: [0, 5, 0]   },
    { t: 5.5,  pos: [6, 3, 11],   look: [0, 2.7, 0] },
    { t: 8,    pos: [-5, 3, 10],  look: [0, 2.8, 0] },
    { t: 9.5,  pos: [-2, 4, 13],  look: [0, 3, 0]   },
    { t: 11,   pos: [0, 10, 26],  look: [0, 5, 0]   },
    { t: 13,   pos: [0, 18, 44],  look: [0, 6, -5]  },
  ],

  // 0 = sunset, 1 = full night (also drives window lights + stars)
  night: [[0, 0.05], [6, 0.15], [9, 0.55], [13, 1]],

  palette: {
    sunset: '#f4a261', dusk: '#4a3470', night: '#070916',
    ground: '#1b1d2b', road: '#2a2c3d', dash: '#ffd166',
    buildings: ['#7b8cde', '#b392ac', '#e5989b', '#6d8bb8', '#9a8c98', '#5e7ce2'],
    hero: '#ef476f', skin: '#ffd6a5', accent: '#ffd166',
  },

  // Hero wave window (seconds)
  wave: { from: 3.2, to: 9.8 },
  // Birds fly-by window (secondary action)
  birds: { from: 8.8, to: 12.5, count: 5 },

  // On-screen text (keep ≤ 4 words, ≥ 1.8s on screen)
  captions: [
    { from: 0.4,  to: 2.8,  text: 'Dadah Warga Kota' },
    { from: 10.2, to: 13,   text: 'sampai jumpa lagi 👋' },
  ],
};

/* ════════════════════════════════════════════════════════════════
   ENGINE — do not rewrite. Pure function of time.
   ════════════════════════════════════════════════════════════════ */
const D = CONFIG.duration;
const q = new URLSearchParams(location.search);
const CAPTURE = q.has('capture');
if (CAPTURE) document.body.classList.add('capture');

// ---- helpers (deterministic) ----
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(CONFIG.seed);
function keyed(keys, t) { // [[t,v],...] linear
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, v0] = keys[i], [t1, v1] = keys[i + 1];
    if (t <= t1) return lerp(v0, v1, (t - t0) / (t1 - t0));
  }
  return keys[keys.length - 1][1];
}
function cr(p0, p1, p2, p3, u) { // Catmull-Rom (uniform) on numbers
  const u2 = u * u, u3 = u2 * u;
  return 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (-p0 + 3 * p1 - 3 * p2 + p3) * u3);
}
function camAt(t) {
  const K = CONFIG.camera; let i = 0;
  while (i < K.length - 2 && t > K[i + 1].t) i++;
  const k0 = K[Math.max(i - 1, 0)], k1 = K[i], k2 = K[i + 1], k3 = K[Math.min(i + 2, K.length - 1)];
  const u = clamp((t - k1.t) / (k2.t - k1.t));
  const f = key => [0, 1, 2].map(a => cr(k0[key][a], k1[key][a], k2[key][a], k3[key][a], u));
  return { pos: f('pos'), look: f('look') };
}
const mix = (c1, c2, u) => new THREE.Color(c1).lerp(new THREE.Color(c2), u);

// ---- renderer / scene ----
const frame = document.getElementById('frame');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: CAPTURE });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
frame.insertBefore(renderer.domElement, frame.firstChild);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(CONFIG.palette.sunset, 40, 170);
const camera = new THREE.PerspectiveCamera(42, 16 / 9, 0.1, 600);

function resize() {
  const w = CAPTURE ? CONFIG.size[0] : frame.clientWidth;
  const h = CAPTURE ? CONFIG.size[1] : frame.clientHeight;
  renderer.setPixelRatio(CAPTURE ? 1 : Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, !CAPTURE ? false : true);
  if (!CAPTURE) { renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%'; }
  camera.aspect = w / h; camera.updateProjectionMatrix();
}

// ---- lights: 3-point ----
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x2a2438, 0.7); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffc489, 2.4);
key.position.set(20, 30, 30); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 120 });
key.shadow.bias = -0.0004; scene.add(key);
const rim = new THREE.DirectionalLight(0x7aa2ff, 0.9); rim.position.set(-20, 15, -30); scene.add(rim);

// ---- ground + road ----
const P = CONFIG.palette;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: P.ground, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(9, 400), new THREE.MeshStandardMaterial({ color: P.road, roughness: .85 }));
road.rotation.x = -Math.PI / 2; road.position.y = 0.01; road.receiveShadow = true; scene.add(road);
const dashMat = new THREE.MeshBasicMaterial({ color: P.dash });
for (let z = -120; z < 60; z += 6) {
  const d = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 2.6), dashMat);
  d.rotation.x = -Math.PI / 2; d.position.set(0, 0.02, z); scene.add(d);
}

// ---- window textures (wall + emissive share the same pattern) ----
function windowTextures() {
  const S = 64, N = 4, c = S / N, wall = document.createElement('canvas'), em = document.createElement('canvas');
  wall.width = wall.height = em.width = em.height = S;
  const a = wall.getContext('2d'), b = em.getContext('2d');
  a.fillStyle = '#fff'; a.fillRect(0, 0, S, S); b.fillStyle = '#000'; b.fillRect(0, 0, S, S);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    a.fillStyle = '#26304f'; a.fillRect(x * c + 3, y * c + 3, c - 6, c - 6);
    if (rng() < 0.6) { b.fillStyle = '#ffd98a'; b.fillRect(x * c + 3, y * c + 3, c - 6, c - 6); }
  }
  const mk = (cv) => { const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.NearestFilter; return t; };
  return [mk(wall), mk(em)];
}
const [wallTex, emTex] = windowTextures();
const buildingMats = [];
function makeBuilding(x, z, w, d, h, color) {
  const rx = Math.max(1, Math.round(w / 6.4)), ry = Math.max(1, Math.round(h / 9.6));
  const m = wallTex.clone(); m.repeat.set(rx, ry); m.needsUpdate = true;
  const e = emTex.clone(); e.repeat.set(rx, ry); e.needsUpdate = true;
  const mat = new THREE.MeshStandardMaterial({ color, map: m, emissive: 0xffffff, emissiveMap: e, emissiveIntensity: 0, roughness: .85 });
  buildingMats.push(mat);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(x, h / 2, z); mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh);
}
for (const side of [-1, 1]) {
  let z = 46;
  while (z > -120) {
    const w = 4 + rng() * 3, d = 5 + rng() * 3, far = Math.abs(z) > 30 ? 8 : 0;
    const h = 8 + rng() * 16 + far;
    makeBuilding(side * (7.5 + w / 2), z - d / 2, w, d, h, P.buildings[Math.floor(rng() * P.buildings.length)]);
    z -= d + 0.8;
  }
}

// ---- sky: sun, stars ----
const sun = new THREE.Mesh(new THREE.SphereGeometry(7, 24, 16), new THREE.MeshBasicMaterial({ color: '#ffd37a', fog: false }));
sun.position.set(0, 16, -140); scene.add(sun);
const starGeo = new THREE.BufferGeometry(), sp = [];
for (let i = 0; i < 500; i++) { const u = rng() * Math.PI * 2, v = 0.1 + rng() * 1.2, r = 300; sp.push(Math.cos(u) * Math.sin(v) * r, Math.cos(v) * r, -Math.abs(Math.sin(u) * Math.sin(v) * r) - 20); }
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false });
scene.add(new THREE.Points(starGeo, starMat));

/* ════════════════════════════════════════════════════════════════
   PROPS — hero character + birds (edit/replace for new videos)
   ════════════════════════════════════════════════════════════════ */
const hero = new THREE.Group(); scene.add(hero);
const M = (c, r = .6) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
function part(geo, mat, x, y, z, parent = hero) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m; }
const body = part(new THREE.CapsuleGeometry(.62, 1.1, 6, 14), M(P.hero), 0, 1.45, 0);
const head = part(new THREE.SphereGeometry(.58, 24, 18), M(P.skin), 0, 3.0, 0);
part(new THREE.SphereGeometry(.07, 10, 8), M('#111'), -.2, 3.08, .52);
part(new THREE.SphereGeometry(.07, 10, 8), M('#111'), .2, 3.08, .52);
const smile = part(new THREE.TorusGeometry(.2, .035, 8, 18, Math.PI), M('#7a2e2e'), 0, 2.9, .54); smile.rotation.z = Math.PI;
part(new THREE.CylinderGeometry(.42, .42, .5, 20), M('#222'), 0, 3.72, 0);       // hat
part(new THREE.CylinderGeometry(.7, .7, .07, 24), M('#222'), 0, 3.47, 0);        // brim
part(new THREE.CylinderGeometry(.14, .14, 1.0, 10), M('#3a3a4a'), -.28, .5, 0);  // legs
part(new THREE.CylinderGeometry(.14, .14, 1.0, 10), M('#3a3a4a'), .28, .5, 0);
const armL = part(new THREE.CylinderGeometry(.12, .12, 1.15, 10), M(P.hero), -.82, 1.7, 0); armL.rotation.z = .15;
const shoulder = new THREE.Group(); shoulder.position.set(.78, 2.2, 0); hero.add(shoulder);
const armR = part(new THREE.CylinderGeometry(.12, .12, 1.15, 10), M(P.hero), 0, -.58, 0, shoulder);
part(new THREE.SphereGeometry(.17, 12, 10), M(P.skin), 0, -1.2, 0, shoulder);    // hand

const birds = [];
for (let i = 0; i < CONFIG.birds.count; i++) {
  const g = new THREE.Group(), mat = M('#eceff4', .8);
  const wl = new THREE.Mesh(new THREE.BoxGeometry(1.4, .06, .5), mat), wr = wl.clone();
  wl.position.x = -.7; wr.position.x = .7; g.add(wl, wr); scene.add(g);
  birds.push({ g, wl, wr, off: i * .35, lane: (i - 2) * 3.2, h: 13 + (i % 3) * 1.6 });
}

/* ════════════════════════════════════════════════════════════════
   UPDATE — one pure function of t
   ════════════════════════════════════════════════════════════════ */
const capEl = document.getElementById('caption');
function update(t) {
  // camera
  const c = camAt(t); camera.position.set(...c.pos); camera.lookAt(...c.look);

  // time of day
  const n = keyed(CONFIG.night, t);
  const sky = n < .5 ? mix(P.sunset, P.dusk, n / .5) : mix(P.dusk, P.night, (n - .5) / .5);
  scene.background = sky; scene.fog.color.copy(sky);
  hemi.intensity = lerp(.8, .22, n);
  key.intensity = lerp(2.4, .35, n); key.color.set(mix('#ffc489', '#8fa8ff', n));
  rim.intensity = lerp(.7, 1.1, n);
  sun.position.y = lerp(16, -6, n); sun.visible = n < .97;
  starMat.opacity = smooth(.45, .9, n);
  const glow = smooth(.05, .6, n) * 1.5;
  for (const m of buildingMats) m.emissiveIntensity = glow;

  // hero: wave + bob + face camera
  const wv = smooth(CONFIG.wave.from, CONFIG.wave.from + .8, t) * (1 - smooth(CONFIG.wave.to - .8, CONFIG.wave.to, t));
  shoulder.rotation.z = lerp(.2, 2.55, wv) + wv * Math.sin(t * 10) * .38;
  body.scale.set(1 - .02 * Math.sin(t * 3), 1 + .03 * Math.sin(t * 3), 1);   // squash & stretch (breath)
  head.position.y = 3.0 + .03 * Math.sin(t * 3 + .4);                         // follow-through lag
  hero.rotation.y = Math.atan2(camera.position.x, camera.position.z) * .8;

  // birds (secondary, only in their window)
  const B = CONFIG.birds, on = t >= B.from && t <= B.to;
  for (const b of birds) {
    b.g.visible = on; if (!on) continue;
    const u = (t - B.from) / (B.to - B.from);
    b.g.position.set(lerp(-60, 60, clamp(u + b.off * .15 - .15)), b.h + Math.sin(t * 2 + b.off) * .5, -10 + b.lane);
    const f = Math.sin(t * 14 + b.off * 5) * .6; b.wl.rotation.z = f; b.wr.rotation.z = -f;
    b.wl.position.y = Math.sin(f) * .3; b.wr.position.y = Math.sin(f) * .3;
  }

  // captions
  let txt = '', op = 0;
  for (const cp of CONFIG.captions) {
    const o = clamp((t - cp.from) / .45) * clamp((cp.to - t) / .45);
    if (o > op) { op = o; txt = cp.text; }
  }
  if (txt && capEl.textContent !== txt) capEl.textContent = txt;
  capEl.style.opacity = op; capEl.style.transform = `translateY(${(1 - op) * 10}px)`;
}

function renderAt(t) { update(t); renderer.render(scene, camera); }
window.renderAt = renderAt;
window.captureAt = (t) => { renderAt(t); return renderer.domElement.toDataURL('image/png'); };
window.CONFIG = CONFIG;

/* ---- playback + scrubber ---- */
resize(); addEventListener('resize', () => { resize(); renderAt(tNow); });
let tNow = 0, playing = true, last = performance.now();
const seek = document.getElementById('seek'), play = document.getElementById('play'), clock = document.getElementById('clock');
seek.max = D;
play.onclick = () => { playing = !playing; play.textContent = playing ? '⏸' : '▶'; };
seek.oninput = () => { tNow = +seek.value; playing = false; play.textContent = '▶'; };
function tick(now) {
  if (playing) { tNow += (now - last) / 1000; if (tNow > D) tNow -= D; }
  last = now; renderAt(tNow); seek.value = tNow;
  const s = CONFIG.scenes.find(s => tNow >= s.from && tNow < s.to);
  clock.textContent = `${tNow.toFixed(1)}s · ${s ? s.name : ''}`;
  requestAnimationFrame(tick);
}
if (CAPTURE) { renderAt(0); window.__ready = true; } else requestAnimationFrame(tick);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 CSS Loaders</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0f0f13;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 60px;
    font-family: system-ui, sans-serif;
  }

  .loader-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    color: #888;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ─── 1. Spinning Ring ─── */
  .ring {
    width: 48px; height: 48px;
    border: 4px solid rgba(99,102,241,0.2);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* ─── 2. Dots Pulse ─── */
  .dots { display: flex; gap: 8px; }
  .dots span {
    width: 10px; height: 10px;
    background: #6366f1;
    border-radius: 50%;
    animation: dotsPulse 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  /* ─── 3. Progress Bar ─── */
  .bar-wrap {
    width: 160px; height: 4px;
    background: rgba(99,102,241,0.2);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #6366f1, #ec4899);
    border-radius: 2px;
    animation: barSlide 1.5s ease-in-out infinite;
  }

  /* ─── 4. Skeleton Shimmer ─── */
  .skeleton {
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .skel-line {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, #1e1e28 25%, #2a2a3a 50%, #1e1e28 75%);
    background-size: 400% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
  }
  .skel-line:nth-child(2) { width: 70%; }
  .skel-line:nth-child(3) { width: 85%; }

  /* ─── 5. Bouncing Ball ─── */
  .bounce-wrap { height: 60px; display: flex; align-items: flex-end; }
  .ball {
    width: 20px; height: 20px;
    background: radial-gradient(circle at 35% 35%, #a5b4fc, #6366f1);
    border-radius: 50%;
    animation: bounce 0.8s cubic-bezier(0.8, 0, 1, 1) infinite alternate;
    box-shadow: 0 20px 10px rgba(99,102,241,0.3);
  }

  /* ─── 6. Orbital Rings ─── */
  .orbital {
    width: 48px; height: 48px;
    position: relative;
  }
  .orbital::before,
  .orbital::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
  }
  .orbital::before {
    border-top-color: #6366f1;
    animation: spin 1s linear infinite;
  }
  .orbital::after {
    border-right-color: #ec4899;
    animation: spin 0.6s linear infinite reverse;
    inset: 8px;
  }

  /* ─── 7. Pixel / Steps Loader ─── */
  .pixel-row { display: flex; gap: 4px; }
  .pixel {
    width: 10px; height: 10px;
    background: #6366f1;
    animation: pixelBlink 1s steps(1) infinite;
  }
  .pixel:nth-child(2) { animation-delay: 0.1s; }
  .pixel:nth-child(3) { animation-delay: 0.2s; }
  .pixel:nth-child(4) { animation-delay: 0.3s; }
  .pixel:nth-child(5) { animation-delay: 0.4s; }
  .pixel:nth-child(6) { animation-delay: 0.5s; }
  .pixel:nth-child(7) { animation-delay: 0.6s; }

  /* ─── 8. Morphing Blob ─── */
  .blob {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    animation: morphBlob 2s ease-in-out infinite;
  }

  /* ─── 9. Radar / Sonar ─── */
  .radar {
    width: 48px; height: 48px;
    border: 2px solid rgba(99,102,241,0.3);
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .radar::after {
    content: "";
    position: absolute;
    width: 100%; height: 100%;
    border: 2px solid #6366f1;
    border-radius: 50%;
    animation: radar 1.5s ease-out infinite;
  }
  .radar-dot {
    width: 6px; height: 6px;
    background: #6366f1;
    border-radius: 50%;
  }

  /* ─── 10. Infinity / Figure-8 ─── */
  .infinity {
    width: 60px; height: 20px;
    position: relative;
  }
  .inf-dot {
    position: absolute;
    width: 10px; height: 10px;
    background: #6366f1;
    border-radius: 50%;
    top: 50%; transform: translateY(-50%);
    animation: infinity8 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
  }
  .inf-dot:nth-child(2) { animation-delay: -1s; background: #ec4899; }

  /* ─── Keyframes ─── */
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes dotsPulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40%            { transform: scale(1.0); opacity: 1.0; }
  }

  @keyframes barSlide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }

  @keyframes shimmer {
    0%   { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  @keyframes bounce {
    from { transform: translateY(0); animation-timing-function: cubic-bezier(0.8,0,1,1); }
    to   { transform: translateY(-40px); animation-timing-function: cubic-bezier(0,0,0.2,1); }
  }

  @keyframes pixelBlink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.1; }
  }

  @keyframes morphBlob {
    0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    25%       { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
    50%       { border-radius: 50% 60% 30% 60% / 30% 60% 70% 40%; }
    75%       { border-radius: 70% 30% 50% 50% / 40% 70% 30% 60%; }
  }

  @keyframes radar {
    0%   { transform: scale(0); opacity: 1; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  @keyframes infinity8 {
    0%   { left: 0%;  transform: translateY(-50%) scale(1.2); }
    25%  { left: 50%; transform: translateY(-50%) scale(0.8); }
    50%  { left: 100%; transform: translateY(-50%) scale(1.2); }
    75%  { left: 50%; transform: translateY(-50%) scale(0.8); }
    100% { left: 0%;  transform: translateY(-50%) scale(1.2); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

  <div class="loader-card">
    <div class="ring"></div>
    <span>Spinning Ring</span>
  </div>

  <div class="loader-card">
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
    <span>Dots Pulse</span>
  </div>

  <div class="loader-card">
    <div class="bar-wrap"><div class="bar-fill"></div></div>
    <span>Progress Bar</span>
  </div>

  <div class="loader-card">
    <div class="skeleton">
      <div class="skel-line"></div>
      <div class="skel-line"></div>
      <div class="skel-line"></div>
    </div>
    <span>Skeleton Shimmer</span>
  </div>

  <div class="loader-card">
    <div class="bounce-wrap"><div class="ball"></div></div>
    <span>Bouncing Ball</span>
  </div>

  <div class="loader-card">
    <div class="orbital"></div>
    <span>Orbital Rings</span>
  </div>

  <div class="loader-card">
    <div class="pixel-row">
      <div class="pixel"></div><div class="pixel"></div>
      <div class="pixel"></div><div class="pixel"></div>
      <div class="pixel"></div><div class="pixel"></div>
      <div class="pixel"></div>
    </div>
    <span>Pixel Steps</span>
  </div>

  <div class="loader-card">
    <div class="blob"></div>
    <span>Morphing Blob</span>
  </div>

  <div class="loader-card">
    <div class="radar">
      <div class="radar-dot"></div>
    </div>
    <span>Radar Sonar</span>
  </div>

  <div class="loader-card">
    <div class="infinity">
      <div class="inf-dot"></div>
      <div class="inf-dot"></div>
    </div>
    <span>Figure-8</span>
  </div>

</body>
</html>
